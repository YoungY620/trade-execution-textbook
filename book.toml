[book]
title = "From Signal to Execution — A Textbook of Optimal Trade Execution"
description = "How an investment view or private edge becomes a realised trade: scheduling, order placement, routing, cost measurement, and the theory, history and practice behind each layer."
language = "en"
src = "src"

[preprocessor.mathprotect]
command = "python3 tools/protect_math.py"

[output.html]
additional-css = ["bd.css"]
additional-js = ["bd-lang.js", "bd-cjksearch.js", "bd-glossary.js"]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/YoungY620/trade-execution-textbook"
edit-url-template = "https://github.com/YoungY620/trade-execution-textbook/edit/main/src/{path}"

[output.html.search]
limit-results = 30
use-boolean-and = true
